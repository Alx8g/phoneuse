name = "phoneuse-push"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
account_id = "fd390209d565a1e61cc9455b1312fe12"

# The APNs key: `wrangler secret put APNS_KEY < AuthKey_XXXX.p8` (the .p8's PEM text). Never in this file.
[vars]
APNS_KEY_ID = "7CV9JYHX47"
APNS_TEAM_ID = "9592R2Q8PP"
BUNDLE_ID = "co.lxe.phoneuse"
PAUSED = ""  # any value stops every push (the kill switch)

[[kv_namespaces]]
binding = "PHONES"
id = "064838ffc5954041a6322dbb437bbcaf"

# Per pairing (rid). Counters are per Cloudflare location and approximate, which is enough: one PC talks to one.
[[ratelimits]]
name = "ACTIVITY_LIMIT"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "ALERT_LIMIT"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "REGISTER_LIMIT"
namespace_id = "1003"
simple = { limit = 30, period = 60 }
