<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Phone Use: a sleepy cloud hugging its phone in a sunset sky. Full bleed and square, as iOS
       wants it (the system draws the rounded mask); the Mac and Linux icons place this artwork in
       their own shapes. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93366A"/>
      <stop offset="0.45" stop-color="#C24A6B"/>
      <stop offset="1" stop-color="#F07A5E"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C2E57"/>
      <stop offset="1" stop-color="#5E2146"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF0E2"/>
      <stop offset="1" stop-color="#FBE3D0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- clouds, back to front -->
  <path fill="#E2667A" d="M0 330 C40 250 140 230 190 290 C220 200 360 190 400 280 C430 270 450 280 470 300 L470 1024 L0 1024 Z"/>
  <path fill="#E2667A" d="M1024 340 C990 270 900 250 860 300 C820 230 700 230 680 300 C650 290 620 300 600 320 L600 1024 L1024 1024 Z"/>
  <path fill="#F27A6C" d="M0 560 C60 500 150 510 180 560 C230 500 330 520 340 590 L340 1024 L0 1024 Z"/>
  <path fill="#F27A6C" d="M1024 560 C970 500 880 510 850 560 C800 500 700 520 690 590 L690 1024 L1024 1024 Z"/>
  <path fill="#FA9461" d="M0 720 C70 650 170 670 200 730 C250 670 350 690 360 760 L360 1024 L0 1024 Z"/>
  <path fill="#FA9461" d="M1024 720 C955 650 855 670 825 730 C775 670 675 690 665 760 L665 1024 L1024 1024 Z"/>

  <!-- the body, behind the head -->
  <ellipse cx="512" cy="740" rx="282" ry="232" fill="url(#skin)"/>
  <!-- shoulders: where the arms meet the head -->
  <path d="M436 556 C360 556 296 596 268 668" fill="none" stroke="#6E2A50" stroke-width="10" stroke-linecap="round"/>
  <path d="M588 556 C664 556 728 596 756 668" fill="none" stroke="#6E2A50" stroke-width="10" stroke-linecap="round"/>

  <!-- the front clouds, over the body's lower edge -->
  <path fill="#FDB35E" d="M0 850 C70 790 180 800 210 860 C260 800 360 820 380 890 C400 870 430 860 460 870 L460 1024 L0 1024 Z"/>
  <path fill="#FDB35E" d="M1024 850 C954 790 844 800 814 860 C764 800 664 820 644 890 C624 870 594 860 564 870 L564 1024 L1024 1024 Z"/>
  <path fill="#FEC468" d="M0 960 C80 900 200 910 240 960 C300 910 420 920 512 960 C604 920 724 910 784 960 C824 910 944 900 1024 960 L1024 1024 L0 1024 Z"/>

  <!-- the head: a cloud -->
  <path fill="url(#skin)" d="M512 150 C620 150 700 220 712 310 C800 300 870 360 870 440 C870 512 812 552 744 552 L280 552 C212 552 154 512 154 440 C154 360 224 300 312 310 C324 220 404 150 512 150 Z"/>
  <!-- face -->
  <path d="M376 372 C390 400 430 400 444 372" fill="none" stroke="#6E2A50" stroke-width="14" stroke-linecap="round"/>
  <path d="M580 372 C594 400 634 400 648 372" fill="none" stroke="#6E2A50" stroke-width="14" stroke-linecap="round"/>
  <path d="M468 442 C484 470 540 470 556 442" fill="none" stroke="#6E2A50" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="342" cy="446" rx="48" ry="35" fill="#FBB9A0"/>
  <ellipse cx="682" cy="446" rx="48" ry="35" fill="#FBB9A0"/>

  <!-- the arms reaching around the phone -->
  <path d="M374 652 C340 672 336 712 368 728" fill="none" stroke="#6E2A50" stroke-width="10" stroke-linecap="round"/>
  <path d="M650 652 C684 672 688 712 656 728" fill="none" stroke="#6E2A50" stroke-width="10" stroke-linecap="round"/>

  <!-- the phone -->
  <rect x="406" y="600" width="212" height="324" rx="40" fill="url(#phone)"/>

  <!-- the hands, holding it from both sides -->
  <path fill="url(#skin)" d="M356 724 C392 712 436 716 452 740 C462 756 456 774 440 780 C458 790 460 812 444 822 C460 834 456 858 436 862 C410 868 372 860 352 842 C334 820 330 760 356 724 Z"/>
  <path fill="url(#skin)" d="M668 724 C632 712 588 716 572 740 C562 756 568 774 584 780 C566 790 564 812 580 822 C564 834 568 858 588 862 C614 868 652 860 672 842 C690 820 694 760 668 724 Z"/>
  <g fill="none" stroke="#F6A98C" stroke-width="8" stroke-linecap="round">
    <path d="M378 780 C398 786 418 786 436 780"/>
    <path d="M372 820 C392 828 416 828 438 822"/>
    <path d="M646 780 C626 786 606 786 588 780"/>
    <path d="M652 820 C632 828 608 828 586 822"/>
  </g>
</svg>
