name: PhoneUse
options:
  bundleIdPrefix: co.lxe
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 9592R2Q8PP
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  PhoneUse:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: PhoneUseWidgets
      - target: PhoneUseNotifications
    entitlements:
      path: App/PhoneUse.entitlements
      properties:
        aps-environment: development
        # Session requests break through Focus (docs/COMPANION.md, "Asking before an agent session").
        com.apple.developer.usernotifications.time-sensitive: true
        # com.apple.security.application-groups: [group.co.lxe.phoneuse]  (see README: add once the group exists)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Phone Use"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSCameraUsageDescription: Phone Use scans the pairing code shown on your computer.
        NSLocalNetworkUsageDescription: Phone Use talks to your Phone Use PC on your network.
        NSBonjourServices: [_phoneuse._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: co.lxe.phoneuse
            CFBundleURLSchemes: [phoneuse]
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.lxe.phoneuse
        PRODUCT_NAME: PhoneUse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Phone Use"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: PhoneUse AppStore
  PhoneUseWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared/Robot.swift, Shared/AgentActivity.swift, Shared/CompanionClient.swift, Shared/CompanionCrypto.swift, Shared/Pairing.swift, Shared/PushRelay.swift]
    entitlements:
      path: Widgets/PhoneUseWidgets.entitlements
      properties: {}
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: "Phone Use"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.lxe.phoneuse.widgets
        PRODUCT_NAME: PhoneUseWidgets
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: PhoneUse Widgets AppStore
  # Opens the sealed text of request notifications sent through the push relay (docs/PUSH-RELAY.md).
  PhoneUseNotifications:
    type: app-extension
    platform: iOS
    sources: [NotificationService, Shared/CompanionCrypto.swift, Shared/Pairing.swift, Shared/PushRelay.swift]
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: "Phone Use"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.lxe.phoneuse.notifications
        PRODUCT_NAME: PhoneUseNotifications
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: PhoneUse Notifications AppStore
  PhoneUseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PhoneUse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.lxe.phoneuse.tests
        GENERATE_INFOPLIST_FILE: YES
  PhoneUseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PhoneUse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.lxe.phoneuse.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PhoneUse
schemes:
  PhoneUse:
    build:
      targets:
        PhoneUse: all
    test:
      targets: [PhoneUseTests, PhoneUseUITests]
