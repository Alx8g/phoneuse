# The nginx site for phoneuse.tech, as installed on lxe.co at
# /etc/nginx/sites-available/phoneuse.tech (a copy for reference; the server's
# is the one that runs). Static site built from ~/phoneuse-site (./deploy.sh),
# deployed to the server's www/phoneuse.tech. Certificates: certbot, webroot.

server {
    listen 80;
    listen [::]:80;
    server_name phoneuse.tech www.phoneuse.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /home/lxe/www/phoneuse.tech;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://phoneuse.tech$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.phoneuse.tech;

    ssl_certificate /home/lxe/letsencrypt/config/live/phoneuse.tech/fullchain.pem;
    ssl_certificate_key /home/lxe/letsencrypt/config/live/phoneuse.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://phoneuse.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name phoneuse.tech;

    ssl_certificate /home/lxe/letsencrypt/config/live/phoneuse.tech/fullchain.pem;
    ssl_certificate_key /home/lxe/letsencrypt/config/live/phoneuse.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/lxe/www/phoneuse.tech;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # any address that isn't there: the site's own page, still a 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    # fonts and images change name or ?v= when they change
    location ~* \.(woff2|png|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
